<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Graph card — 1200×630</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #05070e;
        --fg: #eef2f9;
        --muted: #98a4ba;
        --primary: #4f7dff;
        --accent: #22d3ee;
        --violet: #7c6bff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: var(--ink);
        color: var(--fg);
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 72px 84px;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(148, 163, 184, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.07) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse 85% 75% at 50% 40%, #000 45%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 85% 75% at 50% 40%, #000 45%, transparent 100%);
      }
      .glow {
        position: absolute;
        width: 760px;
        height: 520px;
        left: -140px;
        top: -220px;
        background: radial-gradient(ellipse at center, rgba(79, 125, 255, 0.38), transparent 65%);
        filter: blur(20px);
      }
      .glow-2 {
        position: absolute;
        width: 620px;
        height: 480px;
        right: -160px;
        bottom: -240px;
        background: radial-gradient(ellipse at center, rgba(34, 211, 238, 0.24), transparent 65%);
        filter: blur(20px);
      }
      .content { position: relative; z-index: 2; }
      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 26px;
      }
      .eyebrow::before {
        content: "";
        width: 46px;
        height: 2px;
        background: linear-gradient(90deg, var(--primary), var(--accent));
      }
      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 84px;
        line-height: 1.02;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 22px;
      }
      h1 .grad {
        background: linear-gradient(100deg, var(--primary) 0%, var(--accent) 55%, var(--violet) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .role {
        font-size: 29px;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 36px;
      }
      .role strong { color: var(--fg); font-weight: 600; }
      .chips { display: flex; gap: 11px; flex-wrap: nowrap; }
      .chip {
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        white-space: nowrap;
        color: var(--fg);
        background: rgba(148, 163, 184, 0.09);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 999px;
        padding: 9px 17px;
      }
      .chip.accent {
        border-color: rgba(34, 211, 238, 0.45);
        color: var(--accent);
        background: rgba(34, 211, 238, 0.09);
      }
      .bar {
        position: absolute;
        left: 84px;
        right: 84px;
        bottom: 54px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 2;
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        color: var(--muted);
      }
      .line {
        position: absolute;
        left: 84px;
        right: 84px;
        bottom: 92px;
        height: 2px;
        background: linear-gradient(90deg, var(--primary), var(--accent), var(--violet), transparent 85%);
        z-index: 2;
        opacity: 0.75;
      }
      .domain { color: var(--fg); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="glow-2"></div>

    <div class="content">
      <div class="eyebrow">Portfolio</div>
      <h1>Ahmad<br /><span class="grad">Al-Zawahrah</span></h1>
      <div class="role"><strong>AI Engineer</strong> &amp; Software Developer</div>
      <div class="chips">
        <span class="chip">Machine Learning</span>
        <span class="chip">NLP</span>
        <span class="chip">Cybersecurity</span>
        <span class="chip accent">Next.js</span>
        <span class="chip accent">Python</span>
        <span class="chip accent">Flutter</span>
      </div>
    </div>

    <div class="line"></div>
    <div class="bar">
      <span class="domain">Ahmad Al-Zawahrah — Portfolio</span>
      <span>Projects · Case studies · Writing</span>
    </div>
  </body>
</html>
