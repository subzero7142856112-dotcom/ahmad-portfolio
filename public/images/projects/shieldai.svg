<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="ShieldAI concept: a shield with a checkmark surrounded by connected neural network nodes">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="s-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="s-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8aa8ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="s-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="s-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#s-bg)"/>
  <rect width="1600" height="1000" fill="url(#s-grid)"/>
  <circle cx="1180" cy="240" r="300" fill="#4f7dff" opacity="0.28" filter="url(#s-blur)"/>
  <circle cx="380" cy="780" r="260" fill="#7c6bff" opacity="0.18" filter="url(#s-blur)"/>

  <g stroke="#4f7dff" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M330 250 L560 360"/>
    <path d="M330 750 L560 640"/>
    <path d="M1270 260 L1050 370"/>
    <path d="M1270 740 L1050 640"/>
    <path d="M800 150 L800 245"/>
    <path d="M800 850 L800 790"/>
  </g>

  <g fill="#0a0f1c" stroke="#4f7dff" stroke-opacity="0.55" stroke-width="2">
    <circle cx="330" cy="250" r="16"/>
    <circle cx="330" cy="750" r="16"/>
    <circle cx="1270" cy="260" r="16"/>
    <circle cx="1270" cy="740" r="16"/>
    <circle cx="800" cy="150" r="14"/>
    <circle cx="800" cy="850" r="14"/>
  </g>
  <g fill="#8aa8ff">
    <circle cx="330" cy="250" r="6"/>
    <circle cx="330" cy="750" r="6"/>
    <circle cx="1270" cy="260" r="6"/>
    <circle cx="1270" cy="740" r="6"/>
    <circle cx="800" cy="150" r="5"/>
    <circle cx="800" cy="850" r="5"/>
  </g>

  <path d="M800 245 L985 310 V508 C985 648 905 738 800 790 C695 738 615 648 615 508 V310 Z"
        fill="url(#s-shield)" stroke="url(#s-stroke)" stroke-width="4"/>
  <path d="M712 505 l62 63 l132 -146" fill="none" stroke="#34d399" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#98a4ba">
    <rect x="150" y="420" width="230" height="66" rx="14" fill="#0a0f1c" stroke="#94a3b8" stroke-opacity="0.2"/>
    <text x="265" y="462" text-anchor="middle" fill="#8aa8ff">DeBERTa</text>

    <rect x="150" y="510" width="230" height="66" rx="14" fill="#0a0f1c" stroke="#94a3b8" stroke-opacity="0.2"/>
    <text x="265" y="552" text-anchor="middle">TF-IDF + LR</text>

    <rect x="1220" y="420" width="230" height="66" rx="14" fill="#0a0f1c" stroke="#94a3b8" stroke-opacity="0.2"/>
    <text x="1335" y="462" text-anchor="middle">XGBoost</text>

    <rect x="1220" y="510" width="230" height="66" rx="14" fill="#0a0f1c" stroke="#94a3b8" stroke-opacity="0.2"/>
    <text x="1335" y="552" text-anchor="middle" fill="#22d3ee">Rule signals</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#4f7dff" opacity="0.6">
    <text x="120" y="180">vectorize(text)</text>
    <text x="120" y="216" fill="#94a3b8" opacity="0.75">parse_url(link)</text>
    <text x="1160" y="880" fill="#94a3b8" opacity="0.75">predict()</text>
    <text x="1160" y="916" fill="#22d3ee" opacity="0.75">score &gt; threshold</text>
  </g>
</svg>
