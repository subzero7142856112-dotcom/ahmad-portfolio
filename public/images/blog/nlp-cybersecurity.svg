<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Abstract illustration of text tokens transforming into vector features for security analysis">
  <defs>
    <linearGradient id="b1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <pattern id="b1-grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="b1-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#b1-bg)"/>
  <rect width="1600" height="900" fill="url(#b1-grid)"/>
  <circle cx="1240" cy="230" r="270" fill="#4f7dff" opacity="0.24" filter="url(#b1-blur)"/>
  <circle cx="330" cy="700" r="230" fill="#22d3ee" opacity="0.16" filter="url(#b1-blur)"/>

  <g transform="translate(170 300)">
    <rect width="330" height="230" rx="20" fill="#0a0f1c" stroke="#94a3b8" stroke-opacity="0.24" stroke-width="3"/>
    <path d="M0 0 L165 128 L330 0" fill="none" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="3"/>
    <rect x="40" y="150" width="180" height="12" rx="6" fill="#98a4ba" fill-opacity="0.55"/>
    <rect x="40" y="178" width="120" height="12" rx="6" fill="#98a4ba" fill-opacity="0.3"/>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#8aa8ff">
    <rect x="590" y="250" width="150" height="56" rx="14" fill="#0a0f1c" stroke="#4f7dff" stroke-opacity="0.4"/>
    <text x="665" y="286" text-anchor="middle">verify</text>
    <rect x="620" y="340" width="170" height="56" rx="14" fill="#0a0f1c" stroke="#4f7dff" stroke-opacity="0.4"/>
    <text x="705" y="376" text-anchor="middle">account</text>
    <rect x="580" y="430" width="140" height="56" rx="14" fill="#0a0f1c" stroke="#4f7dff" stroke-opacity="0.4"/>
    <text x="650" y="466" text-anchor="middle">login</text>
    <rect x="640" y="520" width="180" height="56" rx="14" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="730" y="556" text-anchor="middle" fill="#22d3ee">credential</text>
  </g>

  <g stroke="#4f7dff" stroke-opacity="0.4" stroke-width="2">
    <path d="M840 278 L1040 360"/>
    <path d="M820 368 L1040 400"/>
    <path d="M760 458 L1040 440"/>
    <path d="M860 548 L1040 480"/>
  </g>

  <g fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="3">
    <rect x="1040" y="330" width="330" height="60" rx="16"/>
    <rect x="1040" y="410" width="330" height="60" rx="16"/>
    <rect x="1040" y="490" width="330" height="60" rx="16"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.75">
    <rect x="1070" y="356" width="120" height="9" rx="4.5"/>
    <rect x="1070" y="436" width="180" height="9" rx="4.5"/>
    <rect x="1070" y="516" width="90" height="9" rx="4.5"/>
  </g>
  <g fill="#98a4ba" fill-opacity="0.35">
    <rect x="1210" y="356" width="130" height="9" rx="4.5"/>
    <rect x="1270" y="436" width="70" height="9" rx="4.5"/>
    <rect x="1180" y="516" width="160" height="9" rx="4.5"/>
  </g>

  <g transform="translate(1470 380)">
    <path d="M0 -70 L62 -46 V6 C62 62 40 96 0 116 C-40 96 -62 62 -62 6 V-46 Z" fill="#4f7dff" fill-opacity="0.12" stroke="#8aa8ff" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M-24 20 l20 21 l44 -48" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="170" y="230" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#98a4ba" opacity="0.8">tokens → features → decision</text>
</svg>
