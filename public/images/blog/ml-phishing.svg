<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Scatter plot with a decision boundary separating phishing and legitimate samples">
  <defs>
    <linearGradient id="b4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="b4-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8aa8ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="b4-grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="b4-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#b4-bg)"/>
  <rect width="1600" height="900" fill="url(#b4-grid)"/>
  <circle cx="1250" cy="260" r="270" fill="#4f7dff" opacity="0.2" filter="url(#b4-blur)"/>
  <circle cx="360" cy="700" r="240" fill="#f87171" opacity="0.12" filter="url(#b4-blur)"/>

  <!-- axes -->
  <g stroke="#94a3b8" stroke-opacity="0.35" stroke-width="3">
    <path d="M340 700 H1300"/>
    <path d="M340 700 V160"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="21" fill="#98a4ba">
    <text x="1150" y="746">feature space →</text>
    <text x="300" y="180" transform="rotate(-90 300 180)">score →</text>
  </g>

  <!-- decision boundary -->
  <path d="M700 700 C 780 560, 900 420, 1060 200" fill="none" stroke="url(#b4-line)" stroke-width="5" stroke-dasharray="14 12"/>
  <path d="M700 700 C 780 560, 900 420, 1060 200 L1300 200 L1300 700 Z" fill="#34d399" fill-opacity="0.07"/>
  <path d="M700 700 C 780 560, 900 420, 1060 200 L340 200 L340 700 Z" fill="#f87171" fill-opacity="0.07"/>

  <!-- phishing points (left / low) -->
  <g fill="#f87171" fill-opacity="0.85">
    <circle cx="440" cy="620" r="11"/>
    <circle cx="510" cy="540" r="11"/>
    <circle cx="470" cy="430" r="11"/>
    <circle cx="580" cy="640" r="11"/>
    <circle cx="560" cy="360" r="11"/>
    <circle cx="650" cy="560" r="11"/>
    <circle cx="420" cy="330" r="11"/>
    <circle cx="620" cy="270" r="11"/>
    <circle cx="530" cy="690" r="11"/>
    <circle cx="680" cy="660" r="11"/>
    <circle cx="490" cy="230" r="11"/>
    <circle cx="700" cy="440" r="11"/>
  </g>

  <!-- legitimate points (right / high) -->
  <g fill="#34d399" fill-opacity="0.85">
    <circle cx="1200" cy="300" r="11"/>
    <circle cx="1120" cy="380" r="11"/>
    <circle cx="1240" cy="420" r="11"/>
    <circle cx="1060" cy="470" r="11"/>
    <circle cx="1180" cy="540" r="11"/>
    <circle cx="1270" cy="620" r="11"/>
    <circle cx="1000" cy="560" r="11"/>
    <circle cx="1140" cy="650" r="11"/>
    <circle cx="1080" cy="240" r="11"/>
    <circle cx="960" cy="380" r="11"/>
    <circle cx="900" cy="620" r="11"/>
    <circle cx="1250" cy="220" r="11"/>
  </g>

  <!-- legend -->
  <g font-family="system-ui, sans-serif" font-size="24">
    <rect x="1060" y="90" width="330" height="76" rx="16" fill="#0a0f1c" stroke="#94a3b8" stroke-opacity="0.22"/>
    <circle cx="1096" cy="128" r="11" fill="#f87171"/>
    <text x="1120" y="136" fill="#98a4ba">phishing</text>
    <circle cx="1250" cy="128" r="11" fill="#34d399"/>
    <text x="1274" y="136" fill="#98a4ba">legitimate</text>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="24">
    <rect x="140" y="180" width="360" height="150" rx="18" fill="#0a0f1c" stroke="#94a3b8" stroke-opacity="0.2"/>
    <text x="174" y="228" fill="#98a4ba">models compared</text>
    <text x="174" y="270" fill="#8aa8ff">BERT · DeBERTa</text>
    <text x="174" y="306" fill="#22d3ee">TF-IDF + LR · XGBoost</text>
  </g>
</svg>
