<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Abstract code editor window with syntax-highlighted lines and a terminal panel">
  <defs>
    <linearGradient id="b3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="b3-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#080b14"/>
    </linearGradient>
    <pattern id="b3-grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="b3-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#b3-bg)"/>
  <rect width="1600" height="900" fill="url(#b3-grid)"/>
  <circle cx="380" cy="240" r="260" fill="#4f7dff" opacity="0.2" filter="url(#b3-blur)"/>
  <circle cx="1280" cy="720" r="250" fill="#7c6bff" opacity="0.18" filter="url(#b3-blur)"/>

  <g transform="translate(260 140)">
    <rect width="1080" height="620" rx="24" fill="url(#b3-win)" stroke="#94a3b8" stroke-opacity="0.24" stroke-width="3"/>
    <path d="M0 62 h1080" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="34" cy="31" r="9" fill="#ff5f57"/>
    <circle cx="66" cy="31" r="9" fill="#febc2e"/>
    <circle cx="98" cy="31" r="9" fill="#28c840"/>
    <text x="150" y="39" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#98a4ba">shieldai / ensemble.py</text>

    <!-- sidebar -->
    <rect x="0" y="62" width="64" height="558" fill="#94a3b8" fill-opacity="0.05"/>
    <g fill="#94a3b8" fill-opacity="0.45">
      <rect x="22" y="96" width="20" height="20" rx="5"/>
      <rect x="22" y="136" width="20" height="20" rx="5" fill="#4f7dff" fill-opacity="0.9"/>
      <rect x="22" y="176" width="20" height="20" rx="5"/>
      <rect x="22" y="216" width="20" height="20" rx="5"/>
    </g>

    <!-- code lines -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="22">
      <g fill="#4f7dff" fill-opacity="0.6">
        <rect x="92" y="96" width="66" height="10" rx="5"/>
        <rect x="92" y="148" width="44" height="10" rx="5"/>
        <rect x="92" y="200" width="88" height="10" rx="5"/>
        <rect x="92" y="304" width="52" height="10" rx="5"/>
        <rect x="92" y="408" width="74" height="10" rx="5"/>
      </g>
      <g fill="#98a4ba" fill-opacity="0.75">
        <rect x="180" y="96" width="130" height="10" rx="5"/>
        <rect x="330" y="96" width="90" height="10" rx="5"/>
        <rect x="152" y="148" width="220" height="10" rx="5"/>
        <rect x="152" y="200" width="150" height="10" rx="5"/>
        <rect x="320" y="200" width="120" height="10" rx="5"/>
        <rect x="124" y="252" width="300" height="10" rx="5"/>
        <rect x="152" y="304" width="180" height="10" rx="5"/>
        <rect x="124" y="356" width="240" height="10" rx="5"/>
        <rect x="152" y="408" width="200" height="10" rx="5"/>
        <rect x="124" y="460" width="160" height="10" rx="5"/>
      </g>
      <g fill="#34d399" fill-opacity="0.85">
        <rect x="440" y="96" width="120" height="10" rx="5"/>
        <rect x="460" y="304" width="100" height="10" rx="5"/>
        <rect x="300" y="460" width="90" height="10" rx="5"/>
      </g>
      <g fill="#7c6bff" fill-opacity="0.85">
        <rect x="520" y="200" width="140" height="10" rx="5"/>
        <rect x="380" y="356" width="120" height="10" rx="5"/>
      </g>
      <g fill="#22d3ee" fill-opacity="0.8">
        <rect x="400" y="252" width="90" height="10" rx="5"/>
        <rect x="480" y="408" width="130" height="10" rx="5"/>
      </g>
      <g fill="#febc2e" fill-opacity="0.75">
        <rect x="680" y="200" width="110" height="10" rx="5"/>
        <rect x="560" y="148" width="150" height="10" rx="5"/>
      </g>
    </g>

    <!-- terminal -->
    <path d="M64 480 h1016" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="2"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="21">
      <text x="96" y="524" fill="#34d399">$ python train.py --model deberta</text>
      <text x="96" y="562" fill="#98a4ba">epoch 1/3 · loss 0.412</text>
      <text x="96" y="600" fill="#4f7dff">evaluating on held-out split…</text>
    </g>
  </g>
</svg>
